@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

.marquee{
  animation:marquee 18s linear infinite;
}

@keyframes pulseRock{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 0 0 rgba(255,212,0,.55), 0 12px 35px rgba(225,6,0,.55)
  }

  50%{
    transform:scale(1.025);
    box-shadow:0 0 0 8px rgba(255,212,0,0), 0 18px 45px rgba(225,6,0,.72)
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-1.2deg)
  }

  50%{
    transform:rotate(1.2deg) translateY(-2px)
  }
}

@keyframes shine{
  0%{
    left:-45%
  }

  55%{
    left:120%
  }

  100%{
    left:120%
  }
}

@keyframes shakeSoft{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-1px) rotate(-.3deg)
  }

  75%{
    transform:translateX(1px) rotate(.3deg)
  }
}

@keyframes bounceSoft{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-5px)
  }
}

.dopamine-main{
  animation:pulseRock 1.8s ease-in-out infinite, shakeSoft 3.2s ease-in-out infinite;
}

.dopamine-shop{
  animation:wiggle 1.6s ease-in-out infinite;
}

.shine{
  position:absolute;
  top:0;
  bottom:0;
  width:35%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-20deg);
  animation:shine 2.4s ease-in-out infinite;
  pointer-events:none;
}

.bounce-icon{
  animation:bounceSoft 1.1s ease-in-out infinite;
}

@keyframes confettiFall{
  0%{
    transform:translateY(-12px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(230px) rotate(360deg);
    opacity:.25
  }
}

.confetti-piece{
  animation:confettiFall 1.8s ease-in infinite;
}

@keyframes blinkError{
  0%,100%{
    border-color:#E10600;
    box-shadow:0 0 0 0 rgba(225,6,0,0)
  }

  50%{
    border-color:#FFD400;
    box-shadow:0 0 0 4px rgba(225,6,0,.45)
  }
}

@keyframes shakeError{
  0%,100%{
    transform:translateX(0)
  }

  20%{
    transform:translateX(-7px)
  }

  40%{
    transform:translateX(6px)
  }

  60%{
    transform:translateX(-4px)
  }

  80%{
    transform:translateX(3px)
  }
}

.field-error{
  animation:blinkError .7s ease-in-out 3, shakeError .45s ease-in-out 1;
  border-color:#E10600 !important;
}

.shake-error{
  animation:shakeError .45s ease-in-out 1;
}

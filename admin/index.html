  :root{
    --paper:#171717;
    --surface:#232323;
    --ink:#FFFFFF;
    --muted:#C8C8C8;
  }

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--black);
}

body{
  font-family:'Archivo', system-ui, sans-serif;
  color:var(--ink);
}

.font-rock{
  font-family:'Anton', 'Archivo', sans-serif;
  letter-spacing:.02em;
  font-weight:400;
}

button, input, select, textarea{
  font-family:inherit;
}

input, select, textarea{
  outline:none;
}

input:focus, select:focus, textarea:focus{
  outline:3px solid var(--yellow);
  outline-offset:1px;
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1;
  }

  100%{
    transform:translateY(360px) rotate(420deg);
    opacity:0;
  }
}

.confetti-piece{
  position:absolute;
  top:0;
  width:12px;
  height:18px;
  animation:fall 1.6s ease-in forwards;
}

@keyframes popIn{
  from{
    transform:translateY(14px) scale(.96);
    opacity:0;
  }

  to{
    transform:translateY(0) scale(1);
    opacity:1;
  }
}

.pop-in{
  animation:popIn .18s ease-out;
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-1deg);
  }

  50%{
    transform:rotate(1deg);
  }
}

.wiggle{
  animation:wiggle .4s ease-in-out 2;
}

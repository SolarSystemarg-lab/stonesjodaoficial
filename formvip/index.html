*{

}

html{
  background:#000
}

body{
  margin:0;
  background:#000;
  color:var(--ink);
  font-family:Oswald,Arial,sans-serif
}

button,input,select{
  font-family:inherit
}

.marquee-track{
  display:flex;
  width:-moz-max-content;
  width:max-content;
  animation:marquee 18s linear infinite
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

@keyframes pop{
  0%{
    transform:scale(.97) translateY(4px);
    opacity:0
  }

  100%{
    transform:scale(1) translateY(0);
    opacity:1
  }
}

@keyframes shake{
  0%,100%{
    transform:rotate(-1deg)
  }

  50%{
    transform:rotate(1deg)
  }
}

@keyframes destinationFlash{
  0%{
    outline:2px solid rgba(255,212,0,.95);
    outline-offset:2px
  }

  100%{
    outline:2px solid transparent;
    outline-offset:2px
  }
}

.destination-flash{
  animation:destinationFlash 1.2s ease-out both
}

.spin-slow{
  animation:spinSlow 28s linear infinite
}

.pop{
  animation:pop .15s ease-out both
}

.shake{
  animation:shake .15s ease-in-out 2
}

.btn-fast{
  transition:transform .15s ease,background-color .15s ease,border-color .15s ease,opacity .15s ease
}

.btn-fast:active{
  transform:translateY(1px)
}

.field{
  width:100%;
  background:#171717;
  border:1px solid #39302e;
  color:#fff;
  border-radius:10px;
  padding:12px 13px;
  font-size:15px;
  outline:none;
  transition:border-color .15s ease
}

.field:focus{
  border-color:var(--yellow);
  outline:2px solid rgba(255,212,0,.35);
  outline-offset:0
}

.label{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#d8d0ca;
  font-weight:600
}

.chip{
  font-size:11px;
  letter-spacing:.12em;
  font-weight:700
}

@keyframes burstFall{
  0%{
    transform:translate(0,-4px) rotate(0);
    opacity:1
  }

  100%{
    transform:translate(var(--bx,0px),90px) rotate(260deg);
    opacity:0
  }
}

.dopamine-popup{
  animation:dopaminePop .2s ease-out both
}

.dopamine-error{
  animation:dopaminePop .2s ease-out both, dopamineShake .15s ease-in-out .2s 1
}

.dopamine-success{
  animation:dopaminePop .2s ease-out both
}

.field-error{
  border:2px solid #E10600!important;
  animation:errorBlink .9s ease-in-out 2, fieldShake .15s ease-in-out 1;
  background:#2a0e0d!important
}

.box-error{
  border:2px solid #E10600!important;
  animation:errorBlink .9s ease-in-out 2, fieldShake .15s ease-in-out 1;
  background:#2a0e0d!important
}

.confetti-burst{
  position:absolute;
  top:34px;
  width:8px;
  height:12px;
  border-radius:2px;
  animation:burstFall .9s ease-in both;
  pointer-events:none
}

.active\:translate-y-1:active {
  --tw-translate-y: 0.25rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.active\:shadow-none:active {
  --tw-shadow: 0 0 #0000;
  --tw-shadow-colored: 0 0 #0000;
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.disabled\:opacity-60:disabled {
  opacity: 0.6;
}

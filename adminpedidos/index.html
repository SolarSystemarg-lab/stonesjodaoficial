  --tw-text-opacity: 1;
  color: rgb(255 212 0 / var(--tw-text-opacity, 1));

.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));

:root{
  --red:#E10600;
  --yellow:#FFD400;
  --ink:#0a0a0a;
  --surface:#111111;
  --surface2:#1c1c1c;
  --line:#E8E8E8;
  --text:#ffffff;
  --muted:#E5E5E5;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:#000;
  color:var(--text);
  font-family:Impact, "Arial Narrow", "Archivo Black", sans-serif;
  font-weight:800;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  letter-spacing:.2px;
  line-height:1.35
}

button,input,select,textarea{
  font-family:inherit;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  letter-spacing:.2px;
  line-height:1.35
}

input,textarea,select{
  color:#fff;
  font-weight:800;
  background:#000
}

input::-moz-placeholder, textarea::-moz-placeholder{
  color:#E5E5E5;
  opacity:1;
  font-weight:800
}

input::placeholder,textarea::placeholder{
  color:#E5E5E5;
  opacity:1;
  font-weight:800
}

/* NITIDEZ: contorno negro nítido, SIN blur en el texto. El glow vive solo en box-shadow (bordes/cajas). */

.rock,.rock-y,.rock-g,.rock-r,.on-yellow,.on-white{
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  letter-spacing:.2px;
  line-height:1.35;
  -webkit-text-stroke:.6px #000;
  paint-order:stroke fill;
  text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000
}

.rock{
  color:#fff;
  font-weight:900
}

.rock-y{
  color:#FFD400;
  font-weight:900
}

.rock-g{
  color:#A8FFC2;
  font-weight:900
}

.rock-r{
  color:#FFC2C2;
  font-weight:900
}

/* Sobre fondo amarillo/blanco: texto negro sólido, nunca blanco sobre amarillo */

.on-yellow{
  color:#000;
  font-weight:900
}

.on-white{
  color:#000;
  font-weight:900
}

/* Texto secundario: nunca gris clarito */

.text-muted-crisp{
  color:#E5E5E5
}

.card{
  border:2px solid #E8E8E8!important;
  background:#111;
  background-color:#111
}

/* Guía amarilla */

.guide{
  background:#FFD400;
  background-color:#FFD400;
  color:#000;
  border:4px solid #000;
  box-shadow:0 0 0 2px #FFD400,0 8px 0 #E10600
}

.guide p,.guide b,.guide span{
  color:#000!important;
  text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000!important;
  -webkit-text-stroke:.6px #000;
  font-weight:900;
  line-height:1.35;
  letter-spacing:.2px
}

/* Botones con pulso / glow */

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(255,212,0,.75),0 0 18px #FFD400
  }

  50%{
    box-shadow:0 0 0 7px rgba(255,212,0,0),0 0 34px #E10600
  }
}

.btn-pulse{
  animation:pulseGlow 1.25s ease-in-out infinite
}

@keyframes shakeX{
  0%,100%{
    transform:translateX(0)
  }

  20%{
    transform:translateX(-6px)
  }

  40%{
    transform:translateX(6px)
  }

  60%{
    transform:translateX(-4px)
  }

  80%{
    transform:translateX(4px)
  }
}

.btn-blocked{
  animation:shakeX .55s ease-in-out infinite;
  box-shadow:0 0 0 3px #000,0 0 22px #E10600
}

@keyframes flashPop{
  0%{
    filter:brightness(2.2);
    transform:scale(1)
  }

  50%{
    filter:brightness(1.5);
    transform:scale(1.03)
  }

  100%{
    filter:brightness(1);
    transform:scale(1)
  }
}

.flash{
  animation:flashPop .45s ease
}

@keyframes vibrate{
  0%,100%{
    transform:translate(0)
  }

  25%{
    transform:translate(1px,-1px)
  }

  50%{
    transform:translate(-1px,1px)
  }

  75%{
    transform:translate(1px,1px)
  }
}

.vibrate{
  animation:vibrate .18s linear 3
}

/* Celebración */

@keyframes bounceIn{
  0%{
    transform:scale(.55) rotate(-3deg);
    opacity:0
  }

  60%{
    transform:scale(1.12) rotate(2deg);
    opacity:1
  }

  100%{
    transform:scale(1) rotate(0)
  }
}

.bounce-in{
  animation:bounceIn .55s cubic-bezier(.2,1.6,.4,1) both
}

@keyframes fall{
  0%{
    transform:translateY(-20vh) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(110vh) rotate(720deg);
    opacity:.9
  }
}

.confetti{
  position:absolute;
  top:0;
  width:11px;
  height:18px;
  border:2px solid #000;
  animation:fall 2.4s linear infinite
}

@keyframes spinStamp{
  0%{
    transform:rotate(-18deg) scale(2.2);
    opacity:0
  }

  60%{
    transform:rotate(-8deg) scale(1);
    opacity:1
  }

  100%{
    transform:rotate(-8deg) scale(1)
  }
}

.stamp{
  animation:spinStamp .7s ease both;
  border:5px solid #00c853;
  color:#fff;
  background:#000;
  background-color:#000;
  box-shadow:0 0 24px #00c853;
  -webkit-text-stroke:.6px #000;
  text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  letter-spacing:.2px;
  line-height:1.35
}

@keyframes blinkRed{
  0%,100%{
    border-color:#E10600;
    box-shadow:0 0 0 4px #E10600,0 0 24px #E10600
  }

  50%{
    border-color:#fff;
    box-shadow:0 0 0 2px #fff
  }
}

.field-error{
  animation:blinkRed .7s ease-in-out 4;
  border-width:3px!important
}

@keyframes glowPulse{
  0%,100%{
    box-shadow:0 0 18px #FFD400
  }

  50%{
    box-shadow:0 0 38px #E10600
  }
}

.glow{
  animation:glowPulse 1.2s ease-in-out infinite
}

.focus\:border-\[\#FFD400\]:focus {
  --tw-border-opacity: 1;
  border-color: rgb(255 212 0 / var(--tw-border-opacity, 1));
}

:root{
  --red:#E10600;
  --yellow:#FFD400;
  --black:#0a0a0a;
  --surface:#111;
  --paper:#f7f2e8;
  --line:#2b2b2b;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Oswald,Arial,sans-serif
}

button,a,input,textarea{
  font-family:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit
}

.shell{
  min-height:100vh;
  background:#000;
  padding-top:var(--safe-area-inset-top);
  display:flex;
  justify-content:center
}

.app{
  width:100%;
  max-width:430px;
  min-width:0;
  background:#0a0a0a;
  position:relative;
  padding-bottom:92px;
  overflow-x:clip
}

.hero{
  padding:28px 18px 20px;
  background:radial-gradient(circle at 88% 5%,#ff2c22 0,transparent 35%),linear-gradient(145deg,#e10600,#500 72%);
  border-bottom:5px solid var(--yellow);
  overflow-x:clip
}

.eyebrow{
  font-weight:700;
  letter-spacing:.16em;
  font-size:12px
}

.hero h1{
  font-family:Anton,Impact,sans-serif;
  font-size:62px;
  line-height:.85;
  margin:11px 0 8px;
  letter-spacing:.02em
}

.hero h1 span{
  color:var(--yellow)
}

.hero p{
  margin:0;
  font-size:17px
}

.heroTags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:16px
}

.heroTags span{
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  border:1px solid #fff;
  padding:5px 7px;
  background:#0008
}

.notice{
  margin:14px;
  background:var(--yellow);
  color:#111;
  padding:14px;
  border:4px solid #fff;
  box-shadow:6px 6px 0 var(--red)
}

.notice strong{
  font-family:Anton,sans-serif;
  font-size:20px;
  letter-spacing:.04em
}

.notice p{
  margin:7px 0;
  font-size:14px;
  line-height:1.35
}

.notice .mono{
  font-family:monospace;
  font-size:11px;
  word-break:break-all;
  background:#111;
  color:var(--yellow);
  padding:8px
}

.localTag{
  display:block;
  font-size:12px;
  line-height:1.4
}

.access{
  margin:14px;
  border:2px solid var(--red);
  padding:15px;
  background:#191212
}

.noMamita{
  display:inline-block;
  background:var(--red);
  padding:4px 8px;
  font-family:Anton,sans-serif;
  letter-spacing:.08em
}

.access h2{
  font-family:Anton,sans-serif;
  margin:10px 0 4px;
  font-size:25px
}

.access p{
  font-size:14px;
  line-height:1.4;
  color:#ddd;
  margin:0 0 12px
}

.access button,.btnYellow,.btnRed{
  width:100%;
  border:0;
  padding:13px;
  font-family:Anton,sans-serif;
  letter-spacing:.06em;
  font-size:16px
}

.btnRed{
  background:var(--red);
  color:#fff
}

.btnYellow{
  background:var(--yellow);
  color:#111
}

.access small{
  display:block;
  margin-top:9px;
  color:#aaa
}

.accessGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px
}

.accessGrid button{
  font-size:13px;
  padding:12px 6px
}

.accessData,.registerBox{
  display:grid;
  gap:9px;
  margin:10px 0
}

.accessData label,.registerBox label,.accessData input,.registerBox input{
  display:block
}

.accessData label,.registerBox label{
  font-size:12px;
  font-weight:700;
  color:#ddd
}

.accessData input,.registerBox input{
  width:100%;
  margin-top:5px;
  padding:11px;
  border:1px solid #555;
  background:#111;
  color:#fff;
  font-size:14px
}

.registerBox{
  border-top:2px solid var(--red);
  padding-top:12px
}

.accessActive{
  outline:3px solid #fff;
  box-shadow:0 0 0 3px var(--red)
}

.catNav{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:#000;
  display:flex;
  gap:5px;
  padding:10px 8px;
  border-top:3px solid var(--red);
  border-bottom:3px solid var(--red);
  overflow-x:auto;
  scrollbar-width:none
}

.catNav button{
  flex:1 0 auto;
  border:1px solid #444;
  background:#171717;
  color:#fff;
  padding:9px 10px;
  font-weight:700;
  font-size:12px
}

.catNav em{
  font-style:normal;
  color:var(--yellow);
  margin-left:5px
}

.catNav button:active{
  background:var(--red)
}

.category{
  padding:24px 0 8px
}

.catHead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:0 14px 10px
}

.catHead span{
  font-size:11px;
  letter-spacing:.2em;
  color:var(--yellow);
  font-weight:700
}

.catHead h2{
  font-family:Anton,sans-serif;
  font-size:34px;
  margin:0;
  line-height:1
}

.catMeta{
  text-align:right;
  font-size:12px;
  color:#bbb
}

.catMeta b{
  color:var(--yellow)
}

.carouselWrap{
  position:relative
}

.carousel{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  padding:2px calc((100% - min(78%,300px))/2) 12px;
  scroll-padding-inline:calc((100% - min(78%,300px))/2);
  scrollbar-width:none;
  touch-action:pan-x
}

.carousel::-webkit-scrollbar{
  display:none
}

.arrow{
  position:absolute;
  top:95px;
  z-index:5;
  width:38px;
  height:38px;
  border:2px solid #fff;
  background:var(--red);
  color:#fff;
  display:grid;
  place-items:center;
  border-radius:50%;
  box-shadow:0 3px 0 #000
}

.arrow.left{
  left:5px
}

.arrow.right{
  right:5px
}

.arrow:disabled{
  opacity:.45;
  cursor:default
}

.card{
  flex:0 0 78%;
  flex-shrink:0;
  max-width:300px;
  scroll-snap-align:center;
  background:#fff;
  color:#111;
  border:3px solid #111;
  box-shadow:6px 6px 0 var(--red);
  overflow:hidden;
  opacity:.78;
  transform:scale(.97);
  transition:opacity .25s ease,transform .25s ease,box-shadow .25s ease
}

.card.isActive{
  opacity:1;
  transform:scale(1);
  box-shadow:6px 6px 0 var(--red)
}

.photo{
  height:230px;
  background:#111;
  position:relative;
  overflow:hidden
}

.photo img{
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover;
  display:block
}

.photoFallback{
  height:230px;
  background:var(--red);
  color:#fff;
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:8px;
  text-align:center
}

.photoFallback .fallbackMark{
  font-family:Anton,sans-serif;
  font-size:56px;
  line-height:1
}

.photoFallback strong{
  background:var(--yellow);
  color:#111;
  padding:5px 7px;
  align-self:center
}

.photoFallback span:last-child{
  font-size:13px;
  line-height:1.35
}

.cardBody{
  padding:13px
}

.skuRow{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  font-weight:700
}

.skuRow span:last-child{
  color:var(--red)
}

.card h3{
  font-family:Anton,sans-serif;
  font-size:19px;
  line-height:1.1;
  margin:7px 0;
  font-weight:400
}

.desc{
  font-size:13px;
  line-height:1.4;
  margin:0;
  min-height:88px;
  color:#333
}

.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:11px 0
}

.meta span{
  font-size:12px
}

.price{
  font-family:Anton,sans-serif;
  font-size:22px;
  color:var(--red)
}

.selector{
  margin:9px 0
}

.selector label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:5px
}

.seg{
  display:flex;
  flex-wrap:wrap;
  gap:5px
}

.seg button{
  border:1px solid #999;
  background:#eee;
  padding:7px 8px;
  font-size:11px;
  font-weight:700
}

.seg button.active{
  background:#111;
  color:var(--yellow);
  border-color:#111
}

.links{
  display:flex;
  gap:7px;
  margin:10px 0
}

.links a{
  font-size:11px;
  font-weight:700;
  color:#111
}

.rawBtn{
  margin-left:auto;
  border:1px solid #111;
  background:#fff;
  padding:4px 6px;
  font-size:10px;
  font-weight:700
}

.addBtn,.consultBtn,.confirmBtn,.waBtn,.backBtn{
  width:100%;
  border:0;
  padding:13px;
  font-family:Anton,sans-serif;
  letter-spacing:.04em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-decoration:none;
  box-sizing:border-box
}

.addBtn{
  background:var(--red);
  color:#fff
}

.consultBtn{
  background:#25d366;
  color:#052e16
}

.dots{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  padding:2px 14px 0
}

.dots button{
  width:22px;
  height:5px;
  background:#333;
  display:block;
  border:0;
  padding:0;
  cursor:pointer
}

.dots button.active{
  background:var(--yellow);
  width:30px
}

.dots button:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px
}

.checkout{
  margin:28px 12px;
  padding:18px;
  background:#171717;
  border-top:5px solid var(--yellow)
}

.sectionTitle span{
  color:var(--yellow);
  font-size:11px;
  letter-spacing:.18em;
  font-weight:700
}

.sectionTitle h2{
  font-family:Anton,sans-serif;
  font-size:28px;
  margin:3px 0 16px
}

.empty{
  text-align:center;
  padding:20px 10px;
  color:#ccc
}

.empty p{
  font-family:Anton,sans-serif;
  color:#fff;
  font-size:20px;
  margin:8px
}

.cartList{
  display:grid;
  gap:10px
}

.cartRow{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  gap:8px;
  align-items:center;
  background:#fff;
  color:#111;
  padding:10px
}

.cartRow h4{
  font-size:12px;
  margin:3px 0;
  line-height:1.2
}

.cartRow small{
  font-size:10px
}

.qty{
  display:flex;
  align-items:center;
  gap:6px
}

.qty button{
  width:26px;
  height:26px;
  border:1px solid #111;
  background:#eee;
  display:grid;
  place-items:center
}

.trash{
  border:0;
  background:none;
  color:var(--red)
}

.totalRow{
  display:flex;
  justify-content:space-between;
  border-top:2px dashed #666;
  padding:12px 0;
  margin-top:14px;
  font-size:18px
}

.confirmBtn{
  background:var(--red);
  color:#fff;
  margin-top:4px
}

.confirmBtn.yellow{
  background:var(--yellow);
  color:#111
}

.payBox{
  margin-top:18px;
  border-top:2px solid var(--red);
  padding-top:14px
}

.payBox h3{
  font-family:Anton,sans-serif;
  margin:0 0 10px
}

.payGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.pay{
  border:2px solid #666;
  background:#111;
  color:#fff;
  padding:11px;
  text-align:left
}

.pay.active{
  border-color:var(--yellow);
  background:#2a2200
}

.pay b,.pay span{
  display:block
}

.pay span{
  font-size:11px;
  color:#ccc;
  margin-top:4px
}

.field{
  display:block;
  margin-top:13px;
  font-size:13px
}

.field input{
  width:100%;
  margin-top:6px;
  padding:11px;
  border:1px solid #666;
  background:#111;
  color:#fff
}

.payNote{
  font-size:13px;
  color:var(--yellow);
  margin:12px 0
}

.ticket{
  background:#fff;
  color:#111;
  padding:15px
}

.ticketTop{
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:2px solid #111;
  padding-bottom:12px
}

.ticketTop h3{
  font-family:Anton,sans-serif;
  margin:0;
  font-size:22px
}

.ticketTop small{
  font-weight:800
}

.ticketTop .ok,.ticketTop .pending{
  margin-left:auto;
  font-size:10px;
  font-weight:800;
  padding:5px;
  background:#d9ffd9
}

.ticketTop .pending{
  background:#fff0a8
}

.ticketUser{
  font-size:12px
}

.ticketRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  padding:8px 0;
  border-bottom:1px solid #ddd
}

.ticketRow span:first-child{
  max-width:68%
}

.waBtn{
  background:#25d366;
  color:#052e16;
  margin-top:12px
}

.backBtn{
  background:#111;
  color:#fff;
  margin-top:8px
}

.waSection{
  margin:14px;
  padding:16px;
  background:var(--yellow);
  color:#111
}

.waSection h2{
  font-family:Anton,sans-serif;
  display:flex;
  gap:8px;
  align-items:center;
  margin:0;
  font-size:22px
}

.waSection p{
  font-size:13px
}

.waSection textarea{
  width:100%;
  resize:vertical;
  padding:11px;
  border:2px solid #111;
  background:#fff;
  color:#111;
  font-size:13px
}

.waActions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:9px
}

.waActions button{
  border:2px solid #111;
  background:#111;
  color:#fff;
  padding:10px;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:700
}

.waActions span{
  font-weight:800
}

.waSend{
  background:#111;
  color:#fff;
  padding:11px 12px;
  display:flex;
  gap:6px;
  align-items:center;
  font-weight:700;
  text-decoration:none;
  font-size:13px
}

footer{
  text-align:center;
  padding:24px 12px;
  display:grid;
  gap:4px
}

footer b{
  font-family:Anton,sans-serif;
  font-size:24px;
  letter-spacing:.08em
}

footer span{
  color:var(--yellow);
  font-size:12px;
  letter-spacing:.15em
}

footer small{
  color:#999
}

.cartFloat{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:16px;
  z-index:40;
  width:min(398px,calc(100vw - 24px));
  background:var(--red);
  color:#fff;
  border:3px solid #fff;
  border-radius:999px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:9px;
  box-shadow:0 8px 24px #000a;
  font-family:Anton,sans-serif;
  letter-spacing:.04em
}

.cartFloat .count{
  background:var(--yellow);
  color:#111;
  min-width:26px;
  height:26px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-family:Oswald
}

.cartFloat .floatTotal{
  margin-left:auto
}

.cartFloat.pulse{
  animation:pulse .55s ease
}

@keyframes pulse{
  30%{
    transform:translateX(-50%) scale(1.06)
  }
}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:72px;
  z-index:50;
  background:#fff;
  color:#111;
  padding:10px 13px;
  border-left:5px solid var(--red);
  display:flex;
  gap:7px;
  align-items:center;
  font-weight:700;
  font-size:13px;
  box-shadow:0 8px 24px #000a
}

.modalBack{
  position:fixed;
  inset:0;
  background:#000c;
  z-index:60;
  display:grid;
  place-items:end center;
  padding:12px
}

.modal{
  width:100%;
  max-width:406px;
  max-height:88vh;
  overflow-y:auto;
  background:#fff;
  color:#111;
  padding:18px;
  position:relative
}

.modal .close{
  position:absolute;
  right:10px;
  top:10px;
  border:0;
  background:#eee
}

.modal h3{
  font-family:Anton,sans-serif;
  margin:0
}

.modal .muted{
  color:#666;
  font-size:13px
}

.modalCart{
  margin:12px 0
}

.modalCart .cartRow{
  border:1px solid #ddd
}

.confirmBtn:disabled{
  opacity:.45
}

@media(prefers-color-scheme:dark){
  :root{
    --surface:#111
  }
}

@media(max-width:430px){
  .hero h1{
    font-size:46px;
    letter-spacing:0
  }

  .hero{
    padding-left:14px;
    padding-right:14px
  }

  .eyebrow{
    font-size:10px;
    letter-spacing:.1em
  }
}

@media(max-width:390px){
  .desc{
    min-height:104px
  }

  .payGrid{
    grid-template-columns:1fr
  }

  .cartRow{
    grid-template-columns:1fr auto
  }

  .cartRow>strong{
    grid-column:1
  }

  .floatLabel{
    display:none
  }
}

:root{
  --red:#E10600;
  --yellow:#FFD400;
  --black:#0a0a0a;
  --surface:#111;
  --paper:#f7f2e8;
  --line:#2b2b2b;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Oswald,Arial,sans-serif
}

button,a,input,textarea{
  font-family:inherit;
  transition:background-color .15s ease,opacity .15s ease,transform .15s ease,border-color .15s ease
}

button{
  cursor:pointer
}

a{
  color:inherit
}

.topChip{
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:space-between;
  padding:9px 12px;
  font-size:12px;
  line-height:1.3;
  letter-spacing:.02em
}

.topChip.ok{
  background:#1a5c2a;
  color:#fff;
  border-bottom:3px solid var(--yellow)
}

.topChip.blocked{
  background:var(--red);
  color:#fff;
  border-bottom:3px solid var(--yellow)
}

.topChip span{
  flex:1
}

.topChip button{
  flex:0 0 auto;
  border:2px solid #fff;
  background:#000;
  color:#fff;
  padding:6px 8px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.05em
}

.lightboxNote{
  display:flex;
  align-items:flex-start;
  gap:6px;
  margin:14px 0 0;
  padding:10px 11px;
  background:#000;
  color:#fff;
  border:1px solid var(--yellow);
  font-size:13px;
  line-height:1.35
}

.lightboxNote b{
  color:var(--yellow)
}

.blocked{
  margin:14px;
  padding:18px;
  background:#191212;
  border:2px solid var(--red)
}

.blocked h2{
  font-family:Anton,sans-serif;
  font-size:28px;
  line-height:1.05;
  margin:12px 0 8px
}

.blocked p{
  color:#ddd;
  line-height:1.45;
  margin:0 0 14px
}

.blocked small{
  display:block;
  color:#aaa;
  margin-top:10px;
  line-height:1.4
}

.landingBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--yellow);
  color:#111;
  padding:14px;
  font-family:Anton,sans-serif;
  letter-spacing:.05em;
  text-decoration:none;
  margin:0 0 8px
}

.blocked .btnYellow{
  margin-top:0
}

.localData{
  margin:14px 14px 0;
  display:grid;
  gap:9px;
  padding:12px;
  background:#191212;
  border:1px solid #333
}

.localData label{
  font-size:12px;
  font-weight:700;
  color:#ddd
}

.localData input{
  display:block;
  width:100%;
  margin-top:5px;
  padding:11px;
  border:1px solid #555;
  background:#111;
  color:#fff;
  font-size:14px
}

.localData small{
  color:#aaa;
  line-height:1.35
}

.shell{
  min-height:100vh;
  background:#000;
  padding-top:var(--safe-area-inset-top);
  display:flex;
  justify-content:center
}

.app{
  width:100%;
  max-width:430px;
  min-width:0;
  background:#0a0a0a;
  position:relative;
  padding-bottom:92px;
  overflow-x:clip
}

.hero{
  padding:28px 18px 20px;
  background:radial-gradient(circle at 88% 5%,#ff2c22 0,transparent 35%),linear-gradient(145deg,#e10600,#500 72%);
  border-bottom:5px solid var(--yellow);
  overflow-x:clip
}

.eyebrow{
  font-weight:700;
  letter-spacing:.16em;
  font-size:12px
}

.hero h1{
  font-family:Anton,Impact,sans-serif;
  font-size:62px;
  line-height:.85;
  margin:11px 0 8px;
  letter-spacing:.02em
}

.hero h1 span{
  color:var(--yellow)
}

.hero p{
  margin:0;
  font-size:17px
}

.heroTags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:16px
}

.heroTags span{
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  border:1px solid #fff;
  padding:5px 7px;
  background:#0008
}

.notice{
  margin:14px;
  background:var(--yellow);
  color:#111;
  padding:14px;
  border:4px solid #fff;
  box-shadow:6px 6px 0 var(--red)
}

.notice strong{
  font-family:Anton,sans-serif;
  font-size:20px;
  letter-spacing:.04em
}

.notice p{
  margin:7px 0;
  font-size:14px;
  line-height:1.35
}

.notice .mono{
  font-family:monospace;
  font-size:11px;
  word-break:break-all;
  background:#111;
  color:var(--yellow);
  padding:8px
}

.localTag{
  display:block;
  font-size:12px;
  line-height:1.4
}

.access{
  margin:14px;
  border:2px solid var(--red);
  padding:15px;
  background:#191212
}

.noMamita{
  display:inline-block;
  background:var(--red);
  padding:4px 8px;
  font-family:Anton,sans-serif;
  letter-spacing:.08em
}

.access h2{
  font-family:Anton,sans-serif;
  margin:10px 0 4px;
  font-size:25px
}

.access p{
  font-size:14px;
  line-height:1.4;
  color:#ddd;
  margin:0 0 12px
}

.access button,.btnYellow,.btnRed{
  width:100%;
  border:0;
  padding:13px;
  font-family:Anton,sans-serif;
  letter-spacing:.06em;
  font-size:16px
}

.btnRed{
  background:var(--red);
  color:#fff
}

.btnYellow{
  background:var(--yellow);
  color:#111
}

.access small{
  display:block;
  margin-top:9px;
  color:#aaa
}

.accessGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px
}

.accessGrid button{
  font-size:13px;
  padding:12px 6px
}

.accessData,.registerBox{
  display:grid;
  gap:9px;
  margin:10px 0
}

.accessData label,.registerBox label,.accessData input,.registerBox input{
  display:block
}

.accessData label,.registerBox label{
  font-size:12px;
  font-weight:700;
  color:#ddd
}

.accessData input,.registerBox input{
  width:100%;
  margin-top:5px;
  padding:11px;
  border:1px solid #555;
  background:#111;
  color:#fff;
  font-size:14px
}

.registerBox{
  border-top:2px solid var(--red);
  padding-top:12px
}

.accessActive{
  outline:3px solid #fff;
  box-shadow:0 0 0 3px var(--red)
}

.catNav{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:#000;
  display:flex;
  gap:5px;
  padding:10px 8px;
  border-top:3px solid var(--red);
  border-bottom:3px solid var(--red);
  overflow-x:auto;
  scrollbar-width:none
}

.catNav button{
  flex:1 0 auto;
  border:1px solid #444;
  background:#171717;
  color:#fff;
  padding:9px 10px;
  font-weight:700;
  font-size:12px
}

.catNav em{
  font-style:normal;
  color:var(--yellow);
  margin-left:5px
}

.catNav button:active{
  background:var(--red)
}

.catNav button.catActive{
  background:var(--red);
  border-color:#fff;
  color:#fff;
  outline:2px solid var(--yellow)
}

.category{
  padding:24px 0 8px;
  content-visibility:auto;
  contain-intrinsic-size:auto 560px
}

.catHead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:0 14px 10px
}

.catHead span{
  font-size:11px;
  letter-spacing:.2em;
  color:var(--yellow);
  font-weight:700
}

.catHead h2{
  font-family:Anton,sans-serif;
  font-size:34px;
  margin:0;
  line-height:1
}

.catMeta{
  text-align:right;
  font-size:12px;
  color:#bbb
}

.catMeta b{
  color:var(--yellow)
}

.carouselWrap{
  position:relative
}

.carousel{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  padding:2px calc((100% - min(78%,300px))/2) 12px;
  scroll-padding-inline:calc((100% - min(78%,300px))/2);
  scrollbar-width:none;
  touch-action:pan-x;
  transform:translateZ(0);
  will-change:transform
}

.carousel::-webkit-scrollbar{
  display:none
}

.arrow{
  position:absolute;
  top:95px;
  z-index:5;
  width:38px;
  height:38px;
  border:2px solid #fff;
  background:var(--red);
  color:#fff;
  display:grid;
  place-items:center;
  border-radius:50%
}

.arrow.left{
  left:5px
}

.arrow.right{
  right:5px
}

.arrow:disabled{
  opacity:.45;
  cursor:default
}

.card{
  flex:0 0 78%;
  flex-shrink:0;
  max-width:300px;
  scroll-snap-align:center;
  background:#fff;
  color:#111;
  border:3px solid #111;

.card.isActive{

}

.photo{

  background:#111;
  position:relative;
  overflow:hidden
}

.photo img{

  height:100%;
  -o-object-fit:cover;
     object-fit:cover;
  display:block
}

.photoBtn{

  height:100%;
  padding:0;
  border:0;
  background:#111;
  color:#fff;
  display:block;

}

.photoHint{
  position:absolute;
  left:8px;
  bottom:8px;
  display:flex;
  align-items:center;
  gap:5px;
  background:#000;
  color:#fff;
  padding:5px 7px;

  font-weight:800;

}

.photoPlaceholder{

  align-items:center;
  justify-content:center;
  gap:6px;
  color:#fff;
  font-family:Anton,sans-serif;
  font-size:32px
}

.photoPlaceholder small{
  font-family:Oswald,sans-serif;
  font-size:11px;
  color:#ccc
}

.photoFallback{
  height:230px;
  background:var(--red);
  color:#fff;
  padding:18px;

  flex-direction:column;
  justify-content:center;

.photoFallback .fallbackMark{

}

.photoFallback strong{
  background:var(--yellow);

}

.photoFallback span:last-child{
  font-size:13px;
  line-height:1.35
}

.lightboxBack{
  position:fixed;
  inset:0;
  z-index:80;
  background:#000;
  color:#fff;

  flex-direction:column;

}

.lightboxTop{

}

.lightboxTop div{

}

.lightboxTop span{
  font-size:11px;
  letter-spacing:.12em;
  color:var(--yellow);

}

.lightboxTop strong{
  font-family:Anton,sans-serif;
  font-size:20px;
  line-height:1.1;
  font-weight:400
}

.lightboxTop b{

  font-size:18px
}

.lightboxClose{

}

.lightboxStage{

.lightboxImg{

}

.lightboxBackBtn{

}

.lightboxHelp{

.cardBody{

.skuRow{

.desc{

.meta span{

.price{

}

.selector{

.addBtn,.consultBtn,.confirmBtn,.waBtn,.backBtn{
